[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    # discord.utils.escape_markdown passes re.sub's count positionally (library issue, Python 3.13+).
    ignore:'count' is passed as positional argument:DeprecationWarning:discord.utils
    # discord.py imports audioop for voice support (unused here); deprecated on Python 3.11-3.12.
    ignore:'audioop' is deprecated:DeprecationWarning
